name: Credential scan

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credential-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    # Deleting a ref publishes no new source; avoid a runner for each test branch.
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks release
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$tool_dir/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$tool_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$tool_dir/gitleaks.tar.gz" -C "$tool_dir" gitleaks
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Scan all fetched history
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git . --log-opts="--all --full-history -m" \
            --config .gitleaks.toml --gitleaks-ignore-path /dev/null \
            --ignore-gitleaks-allow --max-archive-depth=2 --max-decode-depth=5 --redact=100 --no-banner
      - name: Scan complete tracked source snapshot
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$(mktemp -d)"
          trap 'rm -rf "$source_dir"' EXIT
          git archive HEAD | tar -x -C "$source_dir"
          gitleaks dir "$source_dir" --config .gitleaks.toml \
            --gitleaks-ignore-path /dev/null \
            --ignore-gitleaks-allow --max-archive-depth=2 --max-decode-depth=5 --redact=100 --no-banner
