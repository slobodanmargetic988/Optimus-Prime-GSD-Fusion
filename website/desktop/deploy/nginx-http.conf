# Bootstrap vhost, before the dedicated TLS certificate has been issued.
server {
    listen 80;
    listen [::]:80;
    server_name optimus.weeyuga.com;
    root /srv/optimus.weeyuga.com/current;
    index index.html;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
}
