server {
    listen 80;
    listen [::]:80;
    server_name optimus.weeyuga.com;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://optimus.weeyuga.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name optimus.weeyuga.com;
    ssl_certificate /etc/letsencrypt/live/optimus.weeyuga.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/optimus.weeyuga.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /srv/optimus.weeyuga.com/current;
    index index.html;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Cache-Control "public, max-age=300" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
    access_log /var/log/nginx/optimus-weeyuga-com.access.log;
    error_log /var/log/nginx/optimus-weeyuga-com.error.log warn;
}
